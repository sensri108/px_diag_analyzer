<!-- PHASE 5 — REPORT                                                    -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('What should the Portworx cluster full_report.txt contain — root cause analysis, Smart Signals, remediations?')">
  <rect x="40" y="718" width="640" height="96" rx="8" style="fill:rgb(234,243,222);stroke:rgb(59,109,17);stroke-width:0.5px;"/>
  <text x="165" y="742" dominant-baseline="central"
        style="fill:rgb(39,80,10);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Phase 5 — Report</text>
  <text x="165" y="760" dominant-baseline="central"
        style="fill:rgb(59,109,17);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">px_report.py  ·  cluster metadata · grouped alerts · root cause analysis · remediations</text>
  <text x="165" y="778" dominant-baseline="central"
        style="fill:rgb(59,109,17);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">Smart Signals triggered table  ·  PVC full list  ·  node-down timeline</text>
  <text x="165" y="796" dominant-baseline="central"
        style="fill:rgb(59,109,17);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">→  ~/downloads/&lt;UUID&gt;/reports/&lt;YYYYMMDD_HHMMSS&gt;/</text>
  <text x="560" y="757" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(39,80,10);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">Local FS</text>
</g>

