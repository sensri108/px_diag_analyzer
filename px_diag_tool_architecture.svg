<svg width="100%" viewBox="0 0 720 910" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PX Diag Analyzer — Tool Architecture</title>
<desc>Six-phase pipeline: CLI Orchestrator, Auth, Download (7-day fallback), Extract, Analyze (9 analyzers + predictive pass), Report — with Smart Signals mapping and output artifacts</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- CLI ORCHESTRATOR                                                    -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('How does px_diag.py orchestrate the full pipeline — auth, download, extract, analyze, and report?')">
  <rect x="40" y="12" width="640" height="52" rx="8" style="fill:rgb(246,246,244);stroke:rgb(175,173,165);stroke-width:0.5px;"/>
  <text x="360" y="30" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(28,28,26);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:600;">px_diag.py — CLI Orchestrator</text>
  <text x="360" y="50" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(105,103,96);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">--cluster-uuid &lt;UUID&gt;  ·  --node &lt;hostname&gt;  ·  --local-path &lt;dir&gt;  ·  --date YYYY_MM_DD  ·  --auth-only  ·  --skip-download</text>
</g>

<!-- Arrow -->
<line x1="360" y1="64" x2="360" y2="80" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- PHASE 1 — AUTH                                                      -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('Explain the Fuse2 authentication flow — purelogin SSO, SSH agent forwarding, and paramiko connection')">
  <rect x="40" y="80" width="640" height="72" rx="8" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px;"/>
  <text x="165" y="104" dominant-baseline="central"
        style="fill:rgb(8,80,65);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Phase 1 — Auth</text>
  <text x="165" y="122" dominant-baseline="central"
        style="fill:rgb(15,110,86);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">px_auth.py  ·  purelogin SSO CLI (subprocess)  ·  SSH agent forwarding  ·  paramiko SSHClient</text>
  <text x="560" y="116" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(8,80,65);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">Fuse2 Jump Host</text>
</g>

<!-- Arrow + data label -->
<line x1="360" y1="152" x2="360" y2="168" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="374" y="162" dominant-baseline="central"
      style="fill:rgb(115,114,108);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:10px;">SSHClient</text>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- PHASE 2 — DOWNLOAD                                                  -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('How does the 7-day fallback in px_download.py work when the latest Fuse2 date folder has no auto-diag tarballs?')">
  <rect x="40" y="168" width="640" height="96" rx="8" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px;"/>
  <text x="165" y="192" dominant-baseline="central"
        style="fill:rgb(12,68,124);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Phase 2 — Download</text>
  <text x="165" y="212" dominant-baseline="central"
        style="fill:rgb(24,95,165);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">px_download.py  ·  SFTP walk /fuse2/px_aid/&lt;UUID&gt;/&lt;YYYY_MM_DD&gt;/</text>
  <text x="165" y="230" dominant-baseline="central"
        style="fill:rgb(24,95,165);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">7-day fallback if no auto-diags  ·  latest tarball per node  ·  tqdm progress  ·  skip if cached</text>
  <text x="165" y="248" dominant-baseline="central"
        style="fill:rgb(24,95,165);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">→  ~/downloads/&lt;UUID&gt;/&lt;YYYY_MM_DD&gt;/&lt;node&gt;-auto-diags-&lt;ts&gt;.tar.gz</text>
  <text x="560" y="216" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(12,68,124);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">SFTP  ·  paramiko</text>
</g>

<!-- Arrow + data label -->
<line x1="360" y1="264" x2="360" y2="280" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="374" y="274" dominant-baseline="central"
      style="fill:rgb(115,114,108);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:10px;">list[Path]  .tar.gz</text>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- PHASE 3 — EXTRACT                                                   -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('What does px_extract.py do — how are tarballs decompressed and what is the two-level directory structure?')">
  <rect x="40" y="280" width="640" height="80" rx="8" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px;"/>
  <text x="165" y="304" dominant-baseline="central"
        style="fill:rgb(60,52,137);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Phase 3 — Extract</text>
  <text x="165" y="322" dominant-baseline="central"
        style="fill:rgb(83,74,183);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">px_extract.py  ·  decompress .tar.gz  ·  write manifest.json  ·  ~/downloads/&lt;UUID&gt;/&lt;node&gt;/</text>
  <text x="165" y="340" dominant-baseline="central"
        style="fill:rgb(83,74,183);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">node_root: &lt;node&gt;/var/cores/  ·  diag_root: var/lib/osd/diagfiles/pwx_diag_&lt;id&gt;/misc/</text>
  <text x="560" y="320" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(60,52,137);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">Local FS</text>
</g>

<!-- Arrow + data label -->
<line x1="360" y1="360" x2="360" y2="376" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="374" y="370" dominant-baseline="central"
      style="fill:rgb(115,114,108);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:10px;">list[Path]  extracted dirs</text>

<!-- ═══════════════════════════════════════════════════════════════════ -->
<!-- PHASE 4 — ANALYZE                                                   -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<g onclick="sendPrompt('What are the key error patterns and Smart Signals detected in Portworx diag logs?')">
  <rect x="40" y="376" width="640" height="326" rx="8" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>

  <!-- Analyze header -->
  <text x="360" y="398" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(20,20,19);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500;">Phase 4 — Analyze</text>
  <text x="360" y="416" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(61,61,58);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px;">engine.py  ·  find_diag_root() + find_node_root()  ·  parse_alerts_log() 2130-line NDJSON  ·  patterns/errors.yaml  ·  patterns/forecasts.yaml</text>

  <!-- ── Row 1: Volume / KVDB / Storage ── -->
  <!-- volume.py -->
  <rect x="56" y="430" width="197" height="58" rx="6" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="154" y="452" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(99,56,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">volume.py</text>
  <text x="154" y="470" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(133,79,11);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-01·03·05·06·08·10·11·19·27</text>

  <!-- kvdb.py -->
  <rect x="261" y="430" width="198" height="58" rx="6" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="360" y="452" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(99,56,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">kvdb.py</text>
  <text x="360" y="470" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(133,79,11);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-12 · SS-13 · SS-14  quorum · gRPC</text>

  <!-- storage.py -->
  <rect x="467" y="430" width="197" height="58" rx="6" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);stroke-width:0.5px;"/>
  <text x="565" y="452" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(99,56,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">storage.py</text>
  <text x="565" y="470" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(133,79,11);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">LOCAL-01  STATUS_STORAGE_DOWN</text>

  <!-- ── Row 2: Node / Capacity / License ── -->
  <!-- node.py -->
  <rect x="56" y="496" width="197" height="58" rx="6" style="fill:rgb(252,233,210);stroke:rgb(148,72,10);stroke-width:0.5px;"/>
  <text x="154" y="518" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(105,52,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">node.py</text>
  <text x="154" y="536" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(148,72,10);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-18·21·25·26·27  heap dumps</text>

  <!-- capacity.py -->
  <rect x="261" y="496" width="198" height="58" rx="6" style="fill:rgb(252,233,210);stroke:rgb(148,72,10);stroke-width:0.5px;"/>
  <text x="360" y="518" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(105,52,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">capacity.py</text>
  <text x="360" y="536" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(148,72,10);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-15·16·17·23  pool expand</text>

  <!-- license.py -->
  <rect x="467" y="496" width="197" height="58" rx="6" style="fill:rgb(252,233,210);stroke:rgb(148,72,10);stroke-width:0.5px;"/>
  <text x="565" y="518" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(105,52,6);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">license.py</text>
  <text x="565" y="536" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(148,72,10);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-19  expiry · metering · invalid</text>

  <!-- ── Row 3: Network / Security / Infrastructure ── -->
  <!-- network.py -->
  <rect x="56" y="562" width="197" height="58" rx="6" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="154" y="584" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(113,43,19);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">network.py</text>
  <text x="154" y="602" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(153,60,29);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-22  NFS · port 17002</text>

  <!-- security.py -->
  <rect x="261" y="562" width="198" height="58" rx="6" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="360" y="584" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(113,43,19);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">security.py</text>
  <text x="360" y="602" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(153,60,29);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-09  K8s CVE · in-tree volumes</text>

  <!-- infrastructure.py -->
  <rect x="467" y="562" width="197" height="58" rx="6" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:0.5px;"/>
  <text x="565" y="584" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(113,43,19);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">infrastructure.py</text>
  <text x="565" y="602" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(153,60,29);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">SS-07 · LOCAL-03  dmesg · NFS</text>

  <!-- ── Predictive post-pass (full width) ── -->
  <rect x="56" y="628" width="608" height="52" rx="6" style="fill:rgb(232,242,255);stroke:rgb(50,95,175);stroke-width:0.5px;"/>
  <text x="360" y="648" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(28,65,135);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500;">predictive.py — post-pass  ·  patterns/forecasts.yaml thresholds</text>
  <text x="360" y="666" text-anchor="middle" dominant-baseline="central"
        style="fill:rgb(50,95,175);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:11px;">FORECAST-CAPACITY · FORECAST-STORAGE-DOWN · FORECAST-KVDB-ERRORS · FORECAST-NODE-STATS-GAP  +  _correlate() pass</text>
</g>

